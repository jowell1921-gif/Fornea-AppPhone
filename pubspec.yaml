name: fornea
description: "App móvil de FORNEA para clientes."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  material_ui: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Licencias OFL de las tipografías (se muestran en la pantalla de licencias).
  assets:
    - assets/fonts/inter/OFL.txt
    - assets/fonts/barlow_condensed/OFL.txt

  # Tipografías de marca incluidas en la app (no se descargan al abrirla).
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-Bold.ttf
          weight: 700
    - family: BarlowCondensed
      fonts:
        - asset: assets/fonts/barlow_condensed/BarlowCondensed-Medium.ttf
          weight: 500
        - asset: assets/fonts/barlow_condensed/BarlowCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/barlow_condensed/BarlowCondensed-Bold.ttf
          weight: 700
        - asset: assets/fonts/barlow_condensed/BarlowCondensed-ExtraBold.ttf
          weight: 800
